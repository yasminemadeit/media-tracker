name: Update Media Tracker

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 curl_cffi

      - name: Run scraper
        run: python scraper.py
        env:
          GOODREADS_USER_ID: ${{ secrets.GOODREADS_USER_ID }}
          LETTERBOXD_USERNAME: ${{ secrets.LETTERBOXD_USERNAME }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data.json liked_lists.txt
          git diff --staged --quiet || git commit -m "Update media tracker data"
          git pull --rebase origin main
          git push
