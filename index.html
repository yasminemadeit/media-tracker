<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Tracker</title>
<style>
:root{
  --bg:#f6f4ef;--s1:#fff;--s2:#f0ede6;--bd:#e3dfd5;--tx:#1d1b18;--t2:#6b665c;--t3:#9a9488;
  --ac:#b5651d;--ac-bg:rgba(181,101,29,.1);--ok:#2f855a;--ok-bg:rgba(47,133,90,.12);
  --b1:#d64545;--b2:#7d5ba6;--b3:#2f9e66;--b4:#3b7dd8;--shadow:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111110;--s1:#1a1918;--s2:#232220;--bd:#2e2c29;--tx:#ece9e3;--t2:#a29d93;--t3:#6e6a62;
  --ac:#e0a050;--ac-bg:rgba(224,160,80,.12);--ok:#5ac48a;--ok-bg:rgba(90,196,138,.14);--shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#111110;--s1:#1a1918;--s2:#232220;--bd:#2e2c29;--tx:#ece9e3;--t2:#a29d93;--t3:#6e6a62;
  --ac:#e0a050;--ac-bg:rgba(224,160,80,.12);--ok:#5ac48a;--ok-bg:rgba(90,196,138,.14);--shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 14px;flex-wrap:wrap}
header h1{font-size:19px;font-weight:700;letter-spacing:.3px}
header h1 span{color:var(--ac)}
.status-line{font-size:12px;color:var(--t3)}
.status-line .err{color:var(--b1)}
.hbtns{display:flex;gap:6px}
.ghost{background:none;border:1px solid var(--bd);border-radius:7px;padding:6px 10px;cursor:pointer;color:var(--t2)}
.ghost:hover{color:var(--tx);border-color:var(--t3)}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:0 0 auto;padding:8px 18px;border-radius:8px;border:1px solid var(--bd);background:var(--s1);cursor:pointer;font-weight:600;color:var(--t2)}
.tab.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--s1)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--t2);font-size:13px}
.seg button.on{background:var(--ac-bg);color:var(--ac);font-weight:600}

.ctrl{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin:10px 0}
.ctrl2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ctrl input,.ctrl select,.ctrl2 input,.ctrl2 select{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;min-width:0;width:100%;outline:none}
.ctrl2 input,.ctrl2 select{width:auto}
.ctrl2 input[type=number]{width:84px}
.ctrl2 label{font-size:12px;color:var(--t3)}
input:focus,select:focus{border-color:var(--ac)}
.count{font-size:12px;color:var(--t3);margin:6px 0 10px}

.list{display:flex;flex-direction:column;gap:8px;padding-bottom:30px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;display:flex;gap:12px;box-shadow:var(--shadow)}
.card.done{opacity:.62}
.cover{width:46px;height:68px;border-radius:4px;object-fit:cover;background:var(--s2);flex-shrink:0}
.body{flex:1;min-width:0}
.top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.top h3{font-size:15px;font-weight:600}
.star{font-size:12px;color:var(--ac);white-space:nowrap}
.meta{font-size:12px;color:var(--t2);margin-top:2px}
.desc{font-size:13px;color:var(--t2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;white-space:pre-line}
.desc.open{display:block}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--s2);color:var(--t2)}
.tag.mine{background:var(--ac-bg);color:var(--ac)}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center}
.btn{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.x1{background:var(--b1)}.x2{background:var(--b2)}.x3{background:var(--b3)}.x4{background:var(--b4)}
.lnk{font-size:12px;color:var(--t3);padding:4px 6px}
.lnk:hover{color:var(--tx)}
.act{border:1px solid var(--bd);background:var(--s1);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--t2)}
.act:hover{border-color:var(--t3);color:var(--tx)}
.act.on{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:600}
.spacer{flex:1}
.more{display:block;margin:0 auto 40px;padding:9px 22px}
.empty{text-align:center;color:var(--t3);padding:50px 0}

/* popover */
.pop{position:absolute;z-index:20;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.pop h4{font-size:12px;color:var(--t3);font-weight:600;margin-bottom:6px}
.pop label{display:flex;gap:8px;align-items:center;padding:4px 2px;cursor:pointer;font-size:13px}
.pop .row{display:flex;gap:6px;margin-top:8px}
.pop input[type=text]{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;outline:none;min-width:0}
.pop .full{width:100%;text-align:left;margin-top:4px}
.pop p{font-size:12px;color:var(--t3);margin-top:6px}

@media(max-width:640px){
  .ctrl{grid-template-columns:1fr 1fr}
  .ctrl input{grid-column:1/-1}
  .cover{width:40px;height:60px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Media <span>Tracker</span></h1>
      <div class="status-line" id="statusLine"></div>
    </div>
    <div class="hbtns">
      <button class="ghost" id="settingsBtn">Settings</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="films">Films</button>
    <button class="tab" data-tab="books">Books</button>
  </div>

  <div class="seg" id="statusSeg">
    <button data-s="todo" class="on" id="segTodo">To watch</button>
    <button data-s="done" id="segDone">Watched</button>
    <button data-s="all">All</button>
  </div>

  <div class="ctrl">
    <input id="q" type="search" placeholder="Search title, people, description…" autocomplete="off">
    <select id="genre"></select>
    <select id="src"></select>
    <select id="mine"></select>
  </div>
  <div class="ctrl2">
    <label>Year</label>
    <input id="yFrom" type="number" placeholder="from" min="1880" max="2100">
    <input id="yTo" type="number" placeholder="to" min="1880" max="2100">
    <span id="addedWrap" style="display:none;gap:8px;align-items:center">
      <label>Added since</label><input id="addedFrom" type="date">
    </span>
    <span class="spacer"></span>
    <select id="sort"></select>
  </div>
  <div class="count" id="count"></div>
  <div class="list" id="out"></div>
  <button class="ghost more" id="moreBtn" style="display:none">Show more</button>
</div>

<script src="data.js"></script>
<script>
(function(){
const DATA = window.DATA || {meta:{},films:[],books:[]};
const PAGE = 80;

// ── persistent state (this browser) ──
const KEY = "mediaTracker:v1";
function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return s; }catch(e){}
  return {done:{}, lists:{}, zlib:"1lib.sk"};
}
let S = loadState();
S.done = S.done||{}; S.lists = S.lists||{}; S.zlib = S.zlib||"1lib.sk";
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

// ── view state ──
let tab = "films", status = "todo", shown = PAGE;
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = (t,id) => (t==="films"?"f:":"b:")+id;
const items = () => tab==="films" ? DATA.films : DATA.books;

// ── status line ──
(function(){
  const m = DATA.meta||{}; const parts = [];
  if(m.updated) parts.push("Updated "+new Date(m.updated).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}));
  parts.push(DATA.films.length+" films · "+DATA.books.length+" books");
  const pend = (m.films_pending||0)+(m.books_pending||0);
  if(pend) parts.push(pend+" still loading details");
  let h = esc(parts.join(" · "));
  (m.errors||[]).forEach(e=> h += '<br><span class="err">'+esc(e)+'</span>');
  $("statusLine").innerHTML = h;
})();

// ── dropdowns ──
function opts(sel, label, values, keep){
  const cur = keep ? sel.value : "";
  sel.innerHTML = '<option value="">'+label+'</option>' + values.map(v=>'<option value="'+esc(v)+'">'+esc(v.length>48?v.slice(0,46)+"…":v)+'</option>').join("");
  if(values.includes(cur)) sel.value = cur;
}
function countVals(arr, f){
  const c = {}; arr.forEach(x=> (f(x)||[]).forEach(v=> c[v]=(c[v]||0)+1));
  return Object.keys(c).sort((a,b)=> c[b]-c[a] || a.localeCompare(b));
}
function setupControls(){
  const F = tab==="films";
  opts($("genre"), "All genres", countVals(items(), x=>x.genres));
  if(F){ opts($("src"), "All Letterboxd lists", countVals(items(), x=>x.lists)); $("src").style.display=""; }
  else { $("src").style.display="none"; $("src").value=""; }
  refreshMine(false);
  $("segTodo").textContent = F ? "To watch" : "To read";
  $("segDone").textContent = F ? "Watched" : "Read";
  $("addedWrap").style.display = F ? "none" : "inline-flex";
  const sorts = F
    ? [["title","Title A–Z"],["rating","Highest rated"],["new","Newest"],["old","Oldest"],["short","Shortest"],["long","Longest"],["popular","On most lists"],["finished","Recently watched"]]
    : [["added","Recently added"],["title","Title A–Z"],["rating","Highest rated"],["new","Newest"],["old","Oldest"],["short","Shortest"],["long","Longest"],["finished","Recently read"]];
  $("sort").innerHTML = sorts.map(s=>'<option value="'+s[0]+'">Sort: '+s[1]+'</option>').join("");
}
function refreshMine(keep){
  opts($("mine"), "All of my lists", Object.keys(S.lists).sort(), keep);
}

// ── filtering ──
function filtered(){
  const q = $("q").value.trim().toLowerCase();
  const g = $("genre").value, src = $("src").value, mine = $("mine").value;
  const yf = +$("yFrom").value || 0, yt = +$("yTo").value || 9999;
  const af = tab==="books" ? $("addedFrom").value : "";
  const mineSet = mine ? new Set(S.lists[mine]||[]) : null;
  const F = tab==="films";
  let r = items().filter(x=>{
    const k = key(tab,x.id), isDone = !!S.done[k];
    if(status==="todo" && isDone) return false;
    if(status==="done" && !isDone) return false;
    if(g && !(x.genres||[]).includes(g)) return false;
    if(src && !(x.lists||[]).includes(src)) return false;
    if(mineSet && !mineSet.has(k)) return false;
    if((yf||yt<9999) && (!x.year || x.year<yf || x.year>yt)) return false;
    if(af && (!x.added || x.added < af)) return false;
    if(q){
      const hay = (x.title+" "+(F?x.director:x.author)+" "+(x.genres||[]).join(" ")+" "+(x.year||"")+" "+(x.desc||"")+" "+(x.countries||[]).join(" ")).toLowerCase();
      if(!q.split(/\s+/).every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  const len = x => F ? x.runtime : x.pages;
  const s = $("sort").value;
  const by = {
    title:(a,b)=>a.title.localeCompare(b.title),
    rating:(a,b)=>(b.rating||0)-(a.rating||0),
    new:(a,b)=>(b.year||0)-(a.year||0),
    old:(a,b)=>(a.year||9999)-(b.year||9999),
    short:(a,b)=>(len(a)||99999)-(len(b)||99999),
    long:(a,b)=>(len(b)||0)-(len(a)||0),
    popular:(a,b)=>(b.lists||[]).length-(a.lists||[]).length,
    added:(a,b)=>(b.added||"").localeCompare(a.added||""),
    finished:(a,b)=>(S.done[key(tab,b.id)]||"").localeCompare(S.done[key(tab,a.id)]||""),
  };
  r.sort(by[s]||by.title);
  return r;
}

// ── links ──
function links(x){
  const t = encodeURIComponent(x.title);
  if(tab==="films"){
    const ty = encodeURIComponent(x.title);
    return '<a class="btn x1" target="_blank" rel="noopener" href="https://www.movy.sx/search?q='+ty+'">movy</a>'+
      '<a class="btn x2" target="_blank" rel="noopener" href="https://movienig.ht/search?q='+ty+'">movienig.ht</a>'+
      '<a class="btn x3" target="_blank" rel="noopener" href="https://rivestream.ru/search?q='+ty+'">rive</a>'+
      '<a class="lnk" target="_blank" rel="noopener" href="https://letterboxd.com/film/'+encodeURIComponent(x.id)+'/">Letterboxd ↗</a>';
  }
  const zq = encodeURIComponent((x.title.replace(/\s*\(.*?\)\s*/g," ").replace(/:.*/,"")+" "+(x.author||"")).trim());
  return '<a class="btn x4" target="_blank" rel="noopener" href="https://'+esc(S.zlib)+'/s/'+zq+'?languages%5B0%5D=english&order=popular">Z-Library</a>'+
    (x.id?'<a class="lnk" target="_blank" rel="noopener" href="https://www.goodreads.com/book/show/'+encodeURIComponent(x.id)+'">Goodreads ↗</a>':"");
}

// ── render ──
function card(x){
  const F = tab==="films", k = key(tab,x.id), isDone = !!S.done[k];
  const meta = (F
    ? [x.director, x.year, x.runtime ? Math.floor(x.runtime/60)+"h "+(x.runtime%60)+"m" : "", (x.countries||[])[0]]
    : [x.author, x.year, x.pages ? x.pages+" pages" : "", x.added ? "added "+x.added : ""]
  ).filter(Boolean).join(" · ");
  const mineNames = Object.keys(S.lists).filter(n=> S.lists[n].includes(k));
  const src = F ? (x.lists||[]) : [];
  const tags = mineNames.map(n=>'<span class="tag mine">'+esc(n)+'</span>').join("") +
    (x.genres||[]).slice(0,3).map(gn=>'<span class="tag">'+esc(gn)+'</span>').join("") +
    src.slice(0,2).map(l=>'<span class="tag" title="'+esc(l)+'">'+esc(l.length>28?l.slice(0,26)+"…":l)+'</span>').join("") +
    (src.length>2?'<span class="tag" title="'+esc(src.slice(2).join("\n"))+'">+'+(src.length-2)+' lists</span>':"");
  return '<div class="card'+(isDone?' done':'')+'" data-k="'+esc(k)+'">'+
    (!F && x.img ? '<img class="cover" loading="lazy" src="'+esc(x.img)+'" alt="">' : "")+
    '<div class="body"><div class="top"><h3>'+esc(x.title)+'</h3>'+(x.rating?'<span class="star">★ '+x.rating.toFixed(1)+'</span>':"")+'</div>'+
    (meta?'<div class="meta">'+esc(meta)+'</div>':"")+
    (x.desc?'<div class="desc" title="Click to expand">'+esc(x.desc)+'</div>':"")+
    (tags?'<div class="tags">'+tags+'</div>':"")+
    '<div class="actions">'+links(x)+'<span class="spacer"></span>'+
      '<button class="act" data-a="lists">+ List</button>'+
      '<button class="act'+(isDone?' on':'')+'" data-a="done">'+(isDone?"✓ "+(F?"Watched":"Read"):"Mark "+(F?"watched":"read"))+'</button>'+
    '</div></div></div>';
}
function render(resetPage){
  if(resetPage) shown = PAGE;
  const r = filtered();
  $("count").textContent = r.length.toLocaleString()+" "+(tab==="films"?"films":"books");
  $("out").innerHTML = r.length ? r.slice(0,shown).map(card).join("") : '<div class="empty">Nothing matches.</div>';
  $("moreBtn").style.display = r.length > shown ? "block" : "none";
}

// ── popovers ──
let pop = null;
function closePop(){ if(pop){ pop.remove(); pop=null; } }
function openPop(anchor, html){
  closePop();
  pop = document.createElement("div"); pop.className="pop"; pop.innerHTML = html;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth;
  pop.style.top = (window.scrollY + r.bottom + 6)+"px";
  pop.style.left = Math.max(8, Math.min(window.scrollX + r.right - w, window.innerWidth - w - 8))+"px";
  return pop;
}
function listPop(anchor, k){
  const names = Object.keys(S.lists).sort();
  const p = openPop(anchor,
    '<h4>Add to my lists</h4>'+
    (names.length ? names.map(n=>'<label><input type="checkbox" data-n="'+esc(n)+'"'+(S.lists[n].includes(k)?" checked":"")+'> '+esc(n)+'</label>').join("") : '<p>No lists yet. Make one:</p>')+
    '<div class="row"><input type="text" placeholder="New list name" maxlength="60"><button class="act">Add</button></div>');
  p.addEventListener("change", e=>{
    const n = e.target.dataset.n; if(n==null) return;
    const L = S.lists[n];
    if(e.target.checked){ if(!L.includes(k)) L.push(k); } else S.lists[n] = L.filter(v=>v!==k);
    save(); render(false);
  });
  const inp = p.querySelector("input[type=text]");
  const add = ()=>{
    const n = inp.value.trim(); if(!n) return;
    S.lists[n] = S.lists[n]||[]; if(!S.lists[n].includes(k)) S.lists[n].push(k);
    const top = p.style.top, left = p.style.left;
    save(); refreshMine(true); render(false); listPop(anchor,k);
    pop.style.top = top; pop.style.left = left;
  };
  p.querySelector("button").addEventListener("click", add);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") add(); });
  inp.focus();
}
function settingsPop(anchor){
  const names = Object.keys(S.lists).sort();
  const p = openPop(anchor,
    '<h4>Z-Library domain</h4><div class="row" style="margin-top:0"><input type="text" id="zl" value="'+esc(S.zlib)+'"><button class="act" id="zlSave">Save</button></div>'+
    '<h4 style="margin-top:12px">Theme</h4><div class="row" style="margin-top:0">'+
      '<button class="act" data-th="">Auto</button><button class="act" data-th="light">Light</button><button class="act" data-th="dark">Dark</button></div>'+
    '<h4 style="margin-top:12px">My lists</h4>'+
    (names.length ? names.map(n=>'<label style="justify-content:space-between">'+esc(n)+' <span style="color:var(--t3)">'+S.lists[n].length+' · <a href="#" data-del="'+esc(n)+'" style="color:var(--b1)">delete</a></span></label>').join("") : '<p>None yet. Use “+ List” on any film or book.</p>')+
    '<h4 style="margin-top:12px">Backup</h4>'+
    '<p style="margin-top:0">Watched/read marks and your lists are saved in this browser. Export to move them to another device.</p>'+
    '<div class="row"><button class="act" id="exp">Export</button><button class="act" id="imp">Import</button><input type="file" id="impFile" accept=".json" hidden></div>');
  p.querySelector("#zlSave").onclick = ()=>{ const v = p.querySelector("#zl").value.trim().replace(/^https?:\/\//,"").replace(/\/.*$/,""); if(v){ S.zlib=v; save(); render(false); closePop(); } };
  p.querySelectorAll("[data-th]").forEach(b=> b.onclick = ()=>{ setTheme(b.dataset.th); });
  p.querySelectorAll("[data-del]").forEach(a=> a.onclick = e=>{ e.preventDefault(); delete S.lists[a.dataset.del]; save(); refreshMine(true); render(false); settingsPop(anchor); });
  p.querySelector("#exp").onclick = ()=>{
    const blob = new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "media-tracker-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  };
  p.querySelector("#imp").onclick = ()=> p.querySelector("#impFile").click();
  p.querySelector("#impFile").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    f.text().then(t=>{
      try{
        const inc = JSON.parse(t);
        Object.assign(S.done, inc.done||{});
        for(const n in (inc.lists||{})){ S.lists[n] = Array.from(new Set([...(S.lists[n]||[]), ...inc.lists[n]])); }
        if(inc.zlib) S.zlib = inc.zlib;
        save(); refreshMine(true); render(false); closePop();
      }catch(err){ alert("That file isn't a Media Tracker backup."); }
    });
  };
}
function setTheme(t){
  if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme");
  S.theme = t; save();
}
if(S.theme) setTheme(S.theme);

// ── events ──
document.querySelectorAll(".tab").forEach(b=> b.onclick = ()=>{
  tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  setupControls(); render(true);
});
$("statusSeg").onclick = e=>{
  const b = e.target.closest("button"); if(!b) return;
  status = b.dataset.s;
  $("statusSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  render(true);
};
["q","yFrom","yTo"].forEach(id=> $(id).addEventListener("input", ()=>render(true)));
["genre","src","mine","sort","addedFrom"].forEach(id=> $(id).addEventListener("change", ()=>render(true)));
$("moreBtn").onclick = ()=>{ shown += PAGE; render(false); };
$("settingsBtn").onclick = e=>{ e.stopPropagation(); pop ? closePop() : settingsPop(e.currentTarget); };
$("out").addEventListener("click", e=>{
  const d = e.target.closest(".desc"); if(d){ d.classList.toggle("open"); return; }
  const b = e.target.closest("[data-a]"); if(!b) return;
  e.stopPropagation();
  const k = b.closest(".card").dataset.k;
  if(b.dataset.a==="done"){
    if(S.done[k]) delete S.done[k]; else S.done[k] = new Date().toISOString();
    save(); render(false);
  } else listPop(b, k);
});
document.addEventListener("click", e=>{ if(pop && !pop.contains(e.target)) closePop(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closePop(); });

setupControls(); render(true);
})();
</script>
</body>
</html>
