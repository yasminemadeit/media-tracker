<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Tracker</title>
<style>
:root{
  --bg:#f6f4ef;--s1:#fff;--s2:#f0ede6;--bd:#e3dfd5;--tx:#1d1b18;--t2:#6b665c;--t3:#9a9488;
  --ac:#b5651d;--ac-bg:rgba(181,101,29,.1);--ok:#2f855a;--ok-bg:rgba(47,133,90,.12);
  --b1:#d64545;--b2:#7d5ba6;--b3:#2f9e66;--b4:#3b7dd8;--shadow:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111110;--s1:#1a1918;--s2:#232220;--bd:#2e2c29;--tx:#ece9e3;--t2:#a29d93;--t3:#6e6a62;
  --ac:#e0a050;--ac-bg:rgba(224,160,80,.12);--ok:#5ac48a;--ok-bg:rgba(90,196,138,.14);--shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#111110;--s1:#1a1918;--s2:#232220;--bd:#2e2c29;--tx:#ece9e3;--t2:#a29d93;--t3:#6e6a62;
  --ac:#e0a050;--ac-bg:rgba(224,160,80,.12);--ok:#5ac48a;--ok-bg:rgba(90,196,138,.14);--shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 14px;flex-wrap:wrap}
header h1{font-size:19px;font-weight:700;letter-spacing:.3px}
header h1 span{color:var(--ac)}
.status-line{font-size:12px;color:var(--t3)}
.status-line .err{color:var(--b1)}
.hbtns{display:flex;gap:6px}
.ghost{background:none;border:1px solid var(--bd);border-radius:7px;padding:6px 10px;cursor:pointer;color:var(--t2)}
.ghost:hover{color:var(--tx);border-color:var(--t3)}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:0 0 auto;padding:8px 18px;border-radius:8px;border:1px solid var(--bd);background:var(--s1);cursor:pointer;font-weight:600;color:var(--t2)}
.tab.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--s1)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--t2);font-size:13px}
.seg button.on{background:var(--ac-bg);color:var(--ac);font-weight:600}

.ctrl{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin:10px 0}
.ctrl2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ctrl input,.ctrl select,.ctrl2 input,.ctrl2 select{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;min-width:0;width:100%;outline:none}
.ctrl2 input,.ctrl2 select{width:auto}
.ctrl2 input[type=number]{width:84px}
.ctrl2 label{font-size:12px;color:var(--t3)}
input:focus,select:focus{border-color:var(--ac)}
.fbtn{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fbtn::after{content:" ▾";color:var(--t3)}
.fbtn.active{border-color:var(--ac);color:var(--ac);background:var(--ac-bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips:empty{display:none}
.chips{margin-bottom:10px}
button.lnk{background:none;border:0;cursor:pointer}
.chips .and{font-size:11px;color:var(--t3)}
.chip{font-size:12px;padding:3px 9px;border-radius:14px;background:var(--ac-bg);color:var(--ac);cursor:pointer;border:0}
.chip:hover{text-decoration:line-through}
.tag[data-f]{cursor:pointer}
.tag[data-f]:hover{outline:1px solid var(--t3)}
.pop .opts{max-height:300px;overflow:auto;margin-top:6px}
.pop .opts label{justify-content:flex-start}
.pop .opts em{margin-left:auto;font-style:normal;font-size:11px;color:var(--t3)}
.pop.wide{width:300px}
.pop{max-width:330px}
.count{font-size:12px;color:var(--t3);margin:6px 0 10px}

.list{display:flex;flex-direction:column;gap:8px;padding-bottom:30px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;display:flex;gap:12px;box-shadow:var(--shadow)}
.card.done{opacity:.62}
.cover{width:46px;height:68px;border-radius:4px;object-fit:cover;background:var(--s2);flex-shrink:0}
.body{flex:1;min-width:0}
.top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.top h3{font-size:15px;font-weight:600}
.star{font-size:12px;color:var(--ac);white-space:nowrap}
.meta{font-size:12px;color:var(--t2);margin-top:2px}
.desc{font-size:13px;color:var(--t2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;white-space:pre-line}
.desc.open{display:block}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--s2);color:var(--t2)}
.tag.mine{background:var(--ac-bg);color:var(--ac)}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;align-items:center}
.btn{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.x1{background:var(--b1)}.x2{background:var(--b2)}.x3{background:var(--b3)}.x4{background:var(--b4)}
.lnk{font-size:12px;color:var(--t3);padding:4px 6px}
.lnk:hover{color:var(--tx)}
.act{border:1px solid var(--bd);background:var(--s1);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--t2)}
.act:hover{border-color:var(--t3);color:var(--tx)}
.act.on{background:var(--ok-bg);color:var(--ok);border-color:transparent;font-weight:600}
.spacer{flex:1}
.more{display:block;margin:0 auto 40px;padding:9px 22px}
.empty{text-align:center;color:var(--t3);padding:50px 0}

/* popover */
.pop{position:absolute;z-index:20;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.pop h4{font-size:12px;color:var(--t3);font-weight:600;margin-bottom:6px}
.pop label{display:flex;gap:8px;align-items:center;padding:4px 2px;cursor:pointer;font-size:13px}
.pop .row{display:flex;gap:6px;margin-top:8px}
.pop input[type=text]{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;outline:none;min-width:0}
.pop .full{width:100%;text-align:left;margin-top:4px}
.pop p{font-size:12px;color:var(--t3);margin-top:6px}

@media(max-width:640px){
  .ctrl{grid-template-columns:1fr 1fr}
  .ctrl input{grid-column:1/-1}
  .cover{width:40px;height:60px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Media <span>Tracker</span></h1>
      <div class="status-line" id="statusLine"></div>
    </div>
    <div class="hbtns" style="align-items:center">
      <span class="status-line" id="syncStatus"></span>
      <button class="ghost" id="settingsBtn">Settings</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="films">Films</button>
    <button class="tab" data-tab="books">Books</button>
  </div>

  <div class="seg" id="statusSeg">
    <button data-s="todo" class="on" id="segTodo">To watch</button>
    <button data-s="done" id="segDone">Watched</button>
    <button data-s="all">All</button>
  </div>

  <div class="ctrl">
    <input id="q" type="search" placeholder="Search title, people, description…" autocomplete="off">
    <button class="fbtn" data-f="genre">Genres</button>
    <button class="fbtn" data-f="src">Letterboxd lists</button>
    <button class="fbtn" data-f="mine">My lists</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="ctrl2">
    <label>Year</label>
    <input id="yFrom" type="number" placeholder="from" min="1880" max="2100">
    <input id="yTo" type="number" placeholder="to" min="1880" max="2100">
    <span id="addedWrap" style="display:none;gap:8px;align-items:center">
      <label>Added since</label><input id="addedFrom" type="date">
    </span>
    <span class="spacer"></span>
    <select id="sort"></select>
  </div>
  <div class="count" id="count"></div>
  <div class="list" id="out"></div>
  <button class="ghost more" id="moreBtn" style="display:none">Show more</button>
</div>

<script src="data.js"></script>
<script>
(function(){
const DATA = window.DATA || {meta:{},films:[],books:[]};
const PAGE = 80;

// ── persistent state (this browser) ──
const KEY = "mediaTracker:v1";
function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return s; }catch(e){}
  return {};
}
// S.m holds every mark as {v:1|0, t:time}, so two devices can merge mark by mark.
// S.done and S.lists are derived from it.
const SEP = "\u001f";
const DK = k => "d"+SEP+k, LD = n => "L"+SEP+n, LK = (n,k) => "l"+SEP+n+SEP+k;
let S = loadState();
S.zlib = S.zlib||"1lib.sk"; S.m = S.m||{};
if(!S.migrated){
  const now = new Date().toISOString();
  for(const k in (S.done||{})) S.m[DK(k)] = {v:1, t:S.done[k]||now};
  for(const n in (S.lists||{})){ S.m[LD(n)] = {v:1,t:now}; S.lists[n].forEach(k=> S.m[LK(n,k)] = {v:1,t:now}); }
  S.migrated = 1;
}
function derive(){
  const done = {}, lists = {};
  for(const key in S.m){ const e = S.m[key]; if(e.v && key[0]==="L") lists[key.slice(2)] = []; }
  for(const key in S.m){
    const e = S.m[key]; if(!e.v) continue;
    const p = key.split(SEP);
    if(p[0]==="d") done[p[1]] = e.t;
    else if(p[0]==="l" && lists[p[1]]) lists[p[1]].push(p[2]);
  }
  S.done = done; S.lists = lists;
}
derive();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({m:S.m, zlib:S.zlib, theme:S.theme, migrated:1})); }catch(e){}
}
function put(key, v){
  S.m[key] = {v: v?1:0, t: new Date().toISOString()};
  derive(); save(); scheduleSync();
}
function mergeIn(remote){
  for(const key in remote){
    const r = remote[key], l = S.m[key];
    if(r && typeof r.t==="string" && (!l || r.t > l.t)) S.m[key] = r;
  }
  derive();
}

// ── GitHub sync ──
const SYNC_KEY = "mediaTracker:sync";
let G = {};
try{ G = JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; }catch(e){}
G.branch = G.branch || "tracker-state"; G.path = G.path || "state.json";
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(G)); }catch(e){} }
function guessRepo(){
  const h = location.hostname.match(/^([^.]+)\.github\.io$/i);
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return h ? h[1]+"/"+(seg && !seg.includes(".") ? seg : h[1]+".github.io") : "";
}
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\s/g,""))));
function ghErr(r){
  return new Error(r.status===401 ? "GitHub rejected the token"
    : r.status===403 ? "token doesn't have write access to "+G.repo
    : r.status===404 ? "can't find "+G.repo+" with this token"
    : "GitHub error "+r.status);
}
function gh(method, path, body){
  return fetch("https://api.github.com/repos/"+G.repo+path, {
    method, cache:"no-store",
    headers:{Authorization:"Bearer "+G.token, Accept:"application/vnd.github+json"},
    body: body ? JSON.stringify(body) : undefined,
  });
}
// ── encryption: the file in the repo is AES-256-GCM, keyed from your sync password ──
const ITER = 310000;
const toB64 = bytes => { let s = ""; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
let keyCache = {salt:null, pass:null, key:null}, fileSalt = null;
async function keyFor(saltB64){
  if(keyCache.salt===saltB64 && keyCache.pass===G.pass) return keyCache.key;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(G.pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:fromB64(saltB64), iterations:ITER},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  keyCache = {salt:saltB64, pass:G.pass, key};
  return key;
}
async function openFile(f){
  if(f && f.m && !f.data) return f.m;  // older unencrypted file: re-saved encrypted next time
  fileSalt = f.salt;
  try{
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:fromB64(f.iv)}, await keyFor(f.salt), fromB64(f.data));
    return (JSON.parse(new TextDecoder().decode(plain))||{}).m || {};
  }catch(e){ throw new Error("wrong sync password"); }
}
async function sealFile(obj){
  if(!fileSalt) fileSalt = toB64(crypto.getRandomValues(new Uint8Array(16)));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({name:"AES-GCM", iv}, await keyFor(fileSalt), new TextEncoder().encode(JSON.stringify(obj)));
  return {v:2, alg:"AES-256-GCM", kdf:"PBKDF2-SHA256", iter:ITER, salt:fileSalt, iv:toB64(iv), data:toB64(new Uint8Array(data))};
}
let branchReady = false;
async function ensureBranch(){
  if(branchReady) return;
  let r = await gh("GET", "/git/ref/heads/"+G.branch);
  if(!r.ok){
    if(r.status!==404) throw ghErr(r);
    const repo = await gh("GET", ""); if(!repo.ok) throw ghErr(repo);
    const def = (await repo.json()).default_branch;
    const base = await gh("GET", "/git/ref/heads/"+def); if(!base.ok) throw ghErr(base);
    r = await gh("POST", "/git/refs", {ref:"refs/heads/"+G.branch, sha:(await base.json()).object.sha});
    if(!r.ok && r.status!==422) throw ghErr(r);
  }
  branchReady = true;
}
let syncing = false, syncAgain = false, syncTimer = null, syncMsg = "";
function setSync(msg, bad){
  syncMsg = msg;
  const el = $("syncStatus"); if(!el) return;
  el.textContent = msg; el.style.color = bad ? "var(--b1)" : "";
}
function scheduleSync(){
  if(!G.token) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500);
  setSync("Saving…");
}
async function sync(){
  if(!G.token || !G.repo || !G.pass) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true; setSync("Syncing…");
  try{
    await ensureBranch();
    for(let attempt=0; attempt<3; attempt++){
      const r = await gh("GET", "/contents/"+G.path+"?ref="+G.branch);
      let sha = null, remote = {};
      if(r.ok){ const j = await r.json(); sha = j.sha; remote = await openFile(JSON.parse(b64dec(j.content))); }
      else if(r.status!==404) throw ghErr(r);
      mergeIn(remote); save(); updateFilterUI(); render(false);
      const plainRemote = r.ok && !fileSalt;
      const needsPush = plainRemote || Object.keys(S.m).some(k=> !remote[k] || S.m[k].t > remote[k].t);
      if(!needsPush) break;
      const w = await gh("PUT", "/contents/"+G.path, {
        message:"Update tracker state", branch:G.branch,
        content: b64enc(JSON.stringify(await sealFile({m:S.m}))), ...(sha ? {sha} : {}),
      });
      if(w.ok) break;
      if(w.status!==409 && w.status!==422) throw ghErr(w);  // someone else wrote first: merge and retry
    }
    G.last = new Date().toISOString(); saveSync();
    setSync("Synced ✓");
  }catch(e){
    setSync("Sync failed: "+(e.message||"offline"), true);
  }finally{
    syncing = false;
    if(syncAgain){ syncAgain = false; sync(); }
  }
}

// ── view state ──
let tab = "films", status = "todo", shown = PAGE;
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = (t,id) => (t==="films"?"f:":"b:")+id;
const items = () => tab==="films" ? DATA.films : DATA.books;

// ── status line ──
(function(){
  const m = DATA.meta||{}; const parts = [];
  if(m.updated) parts.push("Updated "+new Date(m.updated).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}));
  parts.push(DATA.films.length+" films · "+DATA.books.length+" books");
  const pend = (m.films_pending||0)+(m.books_pending||0);
  if(pend) parts.push(pend+" still loading details");
  let h = esc(parts.join(" · "));
  (m.errors||[]).forEach(e=> h += '<br><span class="err">'+esc(e)+'</span>');
  $("statusLine").innerHTML = h;
})();

// ── multi-select filters (an item must match every selected value) ──
const SEL = {
  films:{genre:new Set(), src:new Set(), mine:new Set()},
  books:{genre:new Set(), src:new Set(), mine:new Set()},
};
const sel = () => SEL[tab];
const LABEL = {genre:"Genres", src:"Letterboxd lists", mine:"My lists"};
function countPairs(f){
  const c = {};
  if(f==="mine"){
    const pre = tab==="films" ? "f:" : "b:";
    Object.keys(S.lists).forEach(n=> c[n] = S.lists[n].filter(k=>k.startsWith(pre)).length);
  } else {
    items().forEach(x=> ((f==="genre"?x.genres:x.lists)||[]).forEach(v=> c[v]=(c[v]||0)+1));
  }
  return Object.keys(c).sort((a,b)=> c[b]-c[a] || a.localeCompare(b)).map(v=>[v,c[v]]);
}
function updateFilterUI(){
  const s = sel();
  for(const n of [...SEL.films.mine, ...SEL.books.mine]) if(!S.lists[n]){ SEL.films.mine.delete(n); SEL.books.mine.delete(n); }
  document.querySelectorAll(".fbtn").forEach(b=>{
    const n = s[b.dataset.f].size;
    b.textContent = LABEL[b.dataset.f] + (n ? " ("+n+")" : "");
    b.classList.toggle("active", n>0);
  });
  const chips = [];
  ["genre","src","mine"].forEach(f=> s[f].forEach(v=> chips.push('<button class="chip" data-f="'+f+'" data-v="'+esc(v)+'" title="Remove">'+esc(v.length>40?v.slice(0,38)+"…":v)+' ×</button>')));
  $("chips").innerHTML = chips.length
    ? chips.join('<span class="and">and</span>') + (chips.length>1 ? '<button class="lnk" id="clearAll">Clear all</button>' : "")
    : "";
}
function filterPop(anchor, f){
  const vals = countPairs(f), s = sel()[f];
  const p = openPop(anchor,
    '<h4>'+LABEL[f]+' · items must match all you tick</h4>'+
    (vals.length
      ? '<input type="text" placeholder="Find…" style="width:100%"><div class="opts">'+
        vals.map(([v,c])=>'<label data-s="'+esc(v.toLowerCase())+'"><input type="checkbox" data-v="'+esc(v)+'"'+(s.has(v)?" checked":"")+'> <span>'+esc(v)+'</span><em>'+c+'</em></label>').join("")+
        '</div><div class="row"><button class="act" data-clear>Clear</button></div>'
      : '<p>'+(f==="mine" ? "No lists yet. Use “+ List” on any card." : "Nothing here yet.")+'</p>'));
  p.classList.add("wide");
  const r = anchor.getBoundingClientRect();
  p.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.innerWidth - p.offsetWidth - 8))+"px";
  const find = p.querySelector("input[type=text]");
  if(!find) return;
  find.addEventListener("input", ()=>{
    const q = find.value.toLowerCase();
    p.querySelectorAll(".opts label").forEach(l=> l.style.display = l.dataset.s.includes(q) ? "" : "none");
  });
  p.addEventListener("change", e=>{
    const v = e.target.dataset.v; if(v==null) return;
    e.target.checked ? s.add(v) : s.delete(v);
    updateFilterUI(); render(true);
  });
  p.querySelector("[data-clear]").onclick = ()=>{
    s.clear(); p.querySelectorAll(".opts input").forEach(i=>i.checked=false);
    updateFilterUI(); render(true);
  };
  if(window.innerWidth > 640) find.focus();
}
function setupControls(){
  const F = tab==="films";
  document.querySelector('.fbtn[data-f="src"]').style.display = F ? "" : "none";
  refreshMine();
  $("segTodo").textContent = F ? "To watch" : "To read";
  $("segDone").textContent = F ? "Watched" : "Read";
  $("addedWrap").style.display = F ? "none" : "inline-flex";
  const sorts = F
    ? [["title","Title A–Z"],["rating","Highest rated"],["new","Newest"],["old","Oldest"],["short","Shortest"],["long","Longest"],["popular","On most lists"],["finished","Recently watched"]]
    : [["added","Recently added"],["title","Title A–Z"],["rating","Highest rated"],["new","Newest"],["old","Oldest"],["short","Shortest"],["long","Longest"],["finished","Recently read"]];
  $("sort").innerHTML = sorts.map(s=>'<option value="'+s[0]+'">Sort: '+s[1]+'</option>').join("");
}
function refreshMine(){ updateFilterUI(); }

// ── filtering ──
function filtered(){
  const q = $("q").value.trim().toLowerCase();
  const s = sel(), gs = [...s.genre], ss = tab==="films" ? [...s.src] : [];
  const ms = [...s.mine].map(n=> new Set(S.lists[n]||[]));
  const yf = +$("yFrom").value || 0, yt = +$("yTo").value || 9999;
  const af = tab==="books" ? $("addedFrom").value : "";
  const F = tab==="films";
  let r = items().filter(x=>{
    const k = key(tab,x.id), isDone = !!S.done[k];
    if(status==="todo" && isDone) return false;
    if(status==="done" && !isDone) return false;
    if(gs.length && !gs.every(v=> (x.genres||[]).includes(v))) return false;
    if(ss.length && !ss.every(v=> (x.lists||[]).includes(v))) return false;
    if(ms.length && !ms.every(set=> set.has(k))) return false;
    if((yf||yt<9999) && (!x.year || x.year<yf || x.year>yt)) return false;
    if(af && (!x.added || x.added < af)) return false;
    if(q){
      const hay = (x.title+" "+(F?x.director:x.author)+" "+(x.genres||[]).join(" ")+" "+(x.year||"")+" "+(x.desc||"")+" "+(x.countries||[]).join(" ")).toLowerCase();
      if(!q.split(/\s+/).every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  const len = x => F ? x.runtime : x.pages;
  const so = $("sort").value;
  const by = {
    title:(a,b)=>a.title.localeCompare(b.title),
    rating:(a,b)=>(b.rating||0)-(a.rating||0),
    new:(a,b)=>(b.year||0)-(a.year||0),
    old:(a,b)=>(a.year||9999)-(b.year||9999),
    short:(a,b)=>(len(a)||99999)-(len(b)||99999),
    long:(a,b)=>(len(b)||0)-(len(a)||0),
    popular:(a,b)=>(b.lists||[]).length-(a.lists||[]).length,
    added:(a,b)=>(b.added||"").localeCompare(a.added||""),
    finished:(a,b)=>(S.done[key(tab,b.id)]||"").localeCompare(S.done[key(tab,a.id)]||""),
  };
  r.sort(by[so]||by.title);
  return r;
}

// ── links ──
function links(x){
  const t = encodeURIComponent(x.title);
  if(tab==="films"){
    const ty = encodeURIComponent(x.title);
    return '<a class="btn x1" target="_blank" rel="noopener" href="https://www.movy.sx/search?q='+ty+'">movy</a>'+
      '<a class="btn x2" target="_blank" rel="noopener" href="https://movienig.ht/search?q='+ty+'">movienig.ht</a>'+
      '<a class="btn x3" target="_blank" rel="noopener" href="https://rivestream.ru/search?q='+ty+'">rive</a>'+
      '<a class="lnk" target="_blank" rel="noopener" href="https://letterboxd.com/film/'+encodeURIComponent(x.id)+'/">Letterboxd ↗</a>';
  }
  const zq = encodeURIComponent((x.title.replace(/\s*\(.*?\)\s*/g," ").replace(/:.*/,"")+" "+(x.author||"")).trim());
  return '<a class="btn x4" target="_blank" rel="noopener" href="https://'+esc(S.zlib)+'/s/'+zq+'?languages%5B0%5D=english&order=popular">Z-Library</a>'+
    (x.id?'<a class="lnk" target="_blank" rel="noopener" href="https://www.goodreads.com/book/show/'+encodeURIComponent(x.id)+'">Goodreads ↗</a>':"");
}

// ── render ──
function card(x){
  const F = tab==="films", k = key(tab,x.id), isDone = !!S.done[k];
  const meta = (F
    ? [x.director, x.year, x.runtime ? Math.floor(x.runtime/60)+"h "+(x.runtime%60)+"m" : "", (x.countries||[])[0]]
    : [x.author, x.year, x.pages ? x.pages+" pages" : "", x.added ? "added "+x.added : ""]
  ).filter(Boolean).join(" · ");
  const mineNames = Object.keys(S.lists).filter(n=> S.lists[n].includes(k));
  const src = F ? (x.lists||[]) : [];
  const tags = mineNames.map(n=>'<span class="tag mine" data-f="mine" data-v="'+esc(n)+'" title="Filter by this list">'+esc(n)+'</span>').join("") +
    (x.genres||[]).slice(0,6).map(gn=>'<span class="tag" data-f="genre" data-v="'+esc(gn)+'" title="Filter by this genre">'+esc(gn)+'</span>').join("") +
    src.slice(0,2).map(l=>'<span class="tag" data-f="src" data-v="'+esc(l)+'" title="'+esc(l)+'">'+esc(l.length>28?l.slice(0,26)+"…":l)+'</span>').join("") +
    (src.length>2?'<span class="tag" title="'+esc(src.slice(2).join("\n"))+'">+'+(src.length-2)+' lists</span>':"");
  return '<div class="card'+(isDone?' done':'')+'" data-k="'+esc(k)+'">'+
    (!F && x.img ? '<img class="cover" loading="lazy" src="'+esc(x.img)+'" alt="">' : "")+
    '<div class="body"><div class="top"><h3>'+esc(x.title)+'</h3>'+(x.rating?'<span class="star">★ '+x.rating.toFixed(1)+'</span>':"")+'</div>'+
    (meta?'<div class="meta">'+esc(meta)+'</div>':"")+
    (x.desc?'<div class="desc" title="Click to expand">'+esc(x.desc)+'</div>':"")+
    (tags?'<div class="tags">'+tags+'</div>':"")+
    '<div class="actions">'+links(x)+'<span class="spacer"></span>'+
      '<button class="act" data-a="lists">+ List</button>'+
      '<button class="act'+(isDone?' on':'')+'" data-a="done">'+(isDone?"✓ "+(F?"Watched":"Read"):"Mark "+(F?"watched":"read"))+'</button>'+
    '</div></div></div>';
}
function render(resetPage){
  if(resetPage) shown = PAGE;
  const r = filtered();
  $("count").textContent = r.length.toLocaleString()+" "+(tab==="films"?"film":"book")+(r.length===1?"":"s");
  $("out").innerHTML = r.length ? r.slice(0,shown).map(card).join("") : '<div class="empty">Nothing matches.</div>';
  $("moreBtn").style.display = r.length > shown ? "block" : "none";
}

// ── popovers ──
let pop = null;
function closePop(){ if(pop){ pop.remove(); pop=null; } }
function openPop(anchor, html){
  closePop();
  pop = document.createElement("div"); pop.className="pop"; pop.innerHTML = html;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth;
  pop.style.top = (window.scrollY + r.bottom + 6)+"px";
  pop.style.left = Math.max(8, Math.min(window.scrollX + r.right - w, window.innerWidth - w - 8))+"px";
  return pop;
}
function listPop(anchor, k){
  const names = Object.keys(S.lists).sort();
  const p = openPop(anchor,
    '<h4>Add to my lists</h4>'+
    (names.length ? names.map(n=>'<label><input type="checkbox" data-n="'+esc(n)+'"'+(S.lists[n].includes(k)?" checked":"")+'> '+esc(n)+'</label>').join("") : '<p>No lists yet. Make one:</p>')+
    '<div class="row"><input type="text" placeholder="New list name" maxlength="60"><button class="act">Add</button></div>');
  p.addEventListener("change", e=>{
    const n = e.target.dataset.n; if(n==null) return;
    put(LK(n,k), e.target.checked); render(false);
  });
  const inp = p.querySelector("input[type=text]");
  const add = ()=>{
    const n = inp.value.trim(); if(!n) return;
    if(!S.lists[n]) put(LD(n), 1);
    put(LK(n,k), 1);
    const top = p.style.top, left = p.style.left;
    refreshMine(true); render(false); listPop(anchor,k);
    pop.style.top = top; pop.style.left = left;
  };
  p.querySelector("button").addEventListener("click", add);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") add(); });
  inp.focus();
}
function settingsPop(anchor){
  const names = Object.keys(S.lists).sort();
  const p = openPop(anchor,
    '<h4>Z-Library domain</h4><div class="row" style="margin-top:0"><input type="text" id="zl" value="'+esc(S.zlib)+'"><button class="act" id="zlSave">Save</button></div>'+
    '<h4 style="margin-top:12px">Theme</h4><div class="row" style="margin-top:0">'+
      '<button class="act" data-th="">Auto</button><button class="act" data-th="light">Light</button><button class="act" data-th="dark">Dark</button></div>'+
    '<h4 style="margin-top:12px">My lists</h4>'+
    (names.length ? names.map(n=>'<label style="justify-content:space-between">'+esc(n)+' <span style="color:var(--t3)">'+S.lists[n].length+' · <a href="#" data-del="'+esc(n)+'" style="color:var(--b1)">delete</a></span></label>').join("") : '<p>None yet. Use “+ List” on any film or book.</p>')+
    '<h4 style="margin-top:12px">Sync with GitHub</h4>'+
    (G.token
      ? '<p style="margin-top:0">Saving to <b>'+esc(G.repo)+'</b> (branch '+esc(G.branch)+'), encrypted with your sync password.<br>'+esc(syncMsg||"")+(G.last?' · last '+esc(new Date(G.last).toLocaleString()):"")+'</p>'+
        '<div class="row"><button class="act" id="syncNow">Sync now</button><button class="act" id="syncOff">Disconnect</button></div>'
      : '<p style="margin-top:0">Saves your marks and lists to your repo so every device sees them. '+
        '<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--ac)">Create a token ↗</a>: '+
        'Repository access → Only select repositories → your tracker repo; Permissions → Contents → Read and write.</p>'+
        '<div class="row"><input type="text" id="ghRepo" placeholder="owner/repo" value="'+esc(G.repo||guessRepo())+'"></div>'+
        '<div class="row"><input type="password" id="ghTok" placeholder="Paste token (github_pat_…)" autocomplete="off"></div>'+
        '<div class="row"><input type="password" id="ghPass" placeholder="Sync password" autocomplete="new-password"><button class="act" id="syncOn">Connect</button></div>'+
        '<p>The sync password encrypts your marks and lists before they reach GitHub. Use the same one on every device. If you lose it, the synced copy can’t be read.</p>')+
    '<h4 style="margin-top:12px">Backup</h4>'+
    '<div class="row" style="margin-top:0"><button class="act" id="exp">Export</button><button class="act" id="imp">Import</button><input type="file" id="impFile" accept=".json" hidden></div>');
  if(G.token){
    p.querySelector("#syncNow").onclick = async ()=>{ await sync(); settingsPop(anchor); };
    p.querySelector("#syncOff").onclick = ()=>{ delete G.token; delete G.pass; fileSalt = null; saveSync(); setSync(""); settingsPop(anchor); };
  } else {
    p.querySelector("#syncOn").onclick = async ()=>{
      const repo = p.querySelector("#ghRepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/+$/,"");
      const tok = p.querySelector("#ghTok").value.trim();
      const pass = p.querySelector("#ghPass").value;
      if(!/^[\w.-]+\/[\w.-]+$/.test(repo) || !tok || pass.length < 6){
        setSync(pass.length < 6 ? "Use a sync password of at least 6 characters" : "Fill in the repo and token", true); return;
      }
      G.repo = repo; G.token = tok; G.pass = pass; branchReady = false; fileSalt = null; saveSync();
      await sync();
      if(/failed/.test(syncMsg)){ const m = syncMsg; delete G.token; delete G.pass; saveSync(); setSync(m, true); }
      settingsPop(anchor);
    };
  }
  p.querySelector("#zlSave").onclick = ()=>{ const v = p.querySelector("#zl").value.trim().replace(/^https?:\/\//,"").replace(/\/.*$/,""); if(v){ S.zlib=v; save(); render(false); closePop(); } };
  p.querySelectorAll("[data-th]").forEach(b=> b.onclick = ()=>{ setTheme(b.dataset.th); });
  p.querySelectorAll("[data-del]").forEach(a=> a.onclick = e=>{
    e.preventDefault(); const n = a.dataset.del;
    (S.lists[n]||[]).forEach(k=> put(LK(n,k), 0)); put(LD(n), 0);
    refreshMine(true); render(false); settingsPop(anchor);
  });
  p.querySelector("#exp").onclick = ()=>{
    const blob = new Blob([JSON.stringify({m:S.m, zlib:S.zlib})],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "media-tracker-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
  };
  p.querySelector("#imp").onclick = ()=> p.querySelector("#impFile").click();
  p.querySelector("#impFile").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    f.text().then(t=>{
      try{
        const inc = JSON.parse(t);
        if(inc.m) mergeIn(inc.m);
        else {  // older backup format
          for(const k in (inc.done||{})) put(DK(k), 1);
          for(const n in (inc.lists||{})){ if(!S.lists[n]) put(LD(n),1); inc.lists[n].forEach(k=> put(LK(n,k),1)); }
        }
        if(inc.zlib) S.zlib = inc.zlib;
        save(); scheduleSync(); refreshMine(true); render(false); closePop();
      }catch(err){ alert("That file isn't a Media Tracker backup."); }
    });
  };
}
function setTheme(t){
  if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme");
  S.theme = t; save();
}
if(S.theme) setTheme(S.theme);

// ── events ──
document.querySelectorAll(".tab").forEach(b=> b.onclick = ()=>{
  tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  setupControls(); render(true);
});
$("statusSeg").onclick = e=>{
  const b = e.target.closest("button"); if(!b) return;
  status = b.dataset.s;
  $("statusSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  render(true);
};
["q","yFrom","yTo"].forEach(id=> $(id).addEventListener("input", ()=>render(true)));
document.querySelectorAll(".fbtn").forEach(b=> b.onclick = e=>{
  e.stopPropagation();
  if(pop && pop.dataset.f===b.dataset.f){ closePop(); return; }
  filterPop(b, b.dataset.f); pop.dataset.f = b.dataset.f;
});
$("chips").addEventListener("click", e=>{
  if(e.target.id==="clearAll"){ ["genre","src","mine"].forEach(f=>sel()[f].clear()); }
  else { const c = e.target.closest(".chip"); if(!c) return; sel()[c.dataset.f].delete(c.dataset.v); }
  updateFilterUI(); render(true);
});
["sort","addedFrom"].forEach(id=> $(id).addEventListener("change", ()=>render(true)));
$("moreBtn").onclick = ()=>{ shown += PAGE; render(false); };
$("settingsBtn").onclick = e=>{ e.stopPropagation(); pop ? closePop() : settingsPop(e.currentTarget); };
$("out").addEventListener("click", e=>{
  const d = e.target.closest(".desc"); if(d){ d.classList.toggle("open"); return; }
  const t = e.target.closest(".tag[data-f]");
  if(t){ sel()[t.dataset.f].add(t.dataset.v); updateFilterUI(); render(true); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const b = e.target.closest("[data-a]"); if(!b) return;
  e.stopPropagation();
  const k = b.closest(".card").dataset.k;
  if(b.dataset.a==="done"){
    put(DK(k), !S.done[k]); render(false);
  } else listPop(b, k);
});
document.addEventListener("click", e=>{ if(pop && !pop.contains(e.target)) closePop(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closePop(); });

setupControls(); render(true);
if(G.token){ sync(); }
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") sync(); });
window.addEventListener("pagehide", ()=>{ if(syncTimer){ clearTimeout(syncTimer); sync(); } });
})();
</script>
</body>
</html>
